<!DOCTYPE html>
<html lang="en">
 
<head>
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09111f">
 
    <title>Auction Draft Debate</title>
 
    <link rel="stylesheet" href="css/style.css">
 
</head>
 
<body>
 
<div class="game-container">
 
    <header class="topbar">
 
        <h1>Auction Draft Debate</h1>
 
        <div class="category-pill">
 
            <span class="cp-label">Category</span>
 
            <span class="cp-name" id="categoryName">Loading</span>
 
            <span class="cp-meta" id="categoryMeta"></span>
 
        </div>
 
    </header>
 
 
    <!-- Player cards are added here by js/ui.js -->
 
    <main class="board" id="board" data-count="2">
 
        <section class="auction" id="auctionArea">
 
            <div class="auction-banner">Now auctioning</div>
 
            <div id="currentItem">Loading...</div>
 
            <div class="stat-row">
 
                <div class="stat">
 
                    <span class="stat-label">Current bid</span>
 
                    <span class="stat-value gold" id="currentBid">$0</span>
 
                </div>
 
                <div class="stat">
 
                    <span class="stat-label">Leading</span>
 
                    <span class="stat-value" id="currentBidder">None</span>
 
                </div>
 
            </div>
 
            <div id="turnDisplay">Waiting...</div>
 
            <div class="bid-controls">
 
                <input
                    id="bidAmount"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    step="1"
                    placeholder="Bid">
 
                <button id="bidButton" type="button">Bid</button>
 
                <button id="passButton" type="button">Pass</button>
 
            </div>
 
            <div class="skip-bar" id="skipBar">
 
                <div class="skip-head">
 
                    <span class="skip-title">Neither knows</span>
 
                    <span class="skip-meta" id="skipMeta"></span>
 
                </div>
 
                <div class="skip-chips" id="skipChips"></div>
 
            </div>
 
            <div class="notification" id="notification">
 
                <div class="notif-title" id="notifTitle"></div>
 
                <div class="notif-player" id="notifPlayer"></div>
 
                <div class="notif-amount" id="notifAmount"></div>
 
                <div class="notif-item" id="notifItem"></div>
 
            </div>
 
        </section>
 
    </main>
 
 
    <footer class="game-footer">
 
        <div class="message-bar" id="gameMessage">Waiting...</div>
 
        <a class="new-game-button" href="index.html">New game</a>
 
    </footer>
 
</div>
 
<script type="module" src="js/auctionEngine.js"></script>
 
</body>
</html>
