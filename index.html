<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09111f">

    <title>Auction Draft Debate</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="setup-page">

    <div class="setup-card">

        <h1>Auction Draft Debate</h1>

        <p class="subtitle">Build your roster. Win the debate.</p>

        <div class="form-group">

            <label>Players</label>

            <div class="seg" id="playerCount"></div>

        </div>

        <div class="form-group" id="playerField1">

            <label for="player1Name">Player 1</label>

            <input id="player1Name" type="text" placeholder="Name" autocomplete="off">

        </div>

        <div class="form-group" id="playerField2">

            <label for="player2Name">Player 2</label>

            <input id="player2Name" type="text" placeholder="Name" autocomplete="off">

        </div>

        <div class="form-group" id="playerField3">

            <label for="player3Name">Player 3</label>

            <input id="player3Name" type="text" placeholder="Name" autocomplete="off">

        </div>

        <div class="form-group" id="playerField4">

            <label for="player4Name">Player 4</label>

            <input id="player4Name" type="text" placeholder="Name" autocomplete="off">

        </div>

        <div class="form-group">

            <label for="category">Category</label>

            <select id="category"></select>

        </div>

        <div class="form-group" id="sportsModeContainer">

            <label for="sportsMode">Era</label>

            <select id="sportsMode">

                <option value="current">Current players</option>

                <option value="allTime">All-time players</option>

            </select>

        </div>

        <div class="form-row">

            <div class="form-group">

                <label for="budget">Starting budget</label>

                <input id="budget" type="number" inputmode="numeric" min="1" value="100">

            </div>

            <div class="form-group">

                <label for="rosterSize">Roster size</label>

                <input id="rosterSize" type="number" inputmode="numeric" min="1" value="5">

            </div>

        </div>

        <button class="start-button" id="startButton" type="button">

            Start auction

        </button>

    </div>

</div>

<script src="js/settings.js" defer></script>

</body>
</html>
